<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diva Cosmetics - Main Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;
            background:white;
            overflow-x:hidden;
        }

        .circle1, .circle2{
            position:absolute;
            border-radius:50%;
            z-index:0;
            filter:blur(10px);
        }

        .circle1{
            width:300px;
            height:300px;
            background:#f7c8ff;
            top:-80px;
            left:-80px;
            opacity:0.5;
        }

        .circle2{
            width:350px;
            height:350px;
            background:#d7c5ff;
            bottom:-120px;
            right:-120px;
            opacity:0.5;
        }

        /* TOP BAR */
        .topbar{
            width:100%;
            height:70px;
            background:white;
            box-shadow:0 5px 20px rgba(0,0,0,0.05);
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 30px;
            position:relative;
            z-index:1;
        }

       .logo{
    font-size:30px;
    font-family:'Great Vibes', cursive;
    color:#8d63c7;
}

        .menu{
            display:flex;
            gap:20px;
            align-items:center;
        }

        .menu a{
            text-decoration:none;
            color:#777;
            font-weight:500;
            transition:0.3s;
        }

        .menu a:hover{
            color:#8d63c7;
        }

        .cart{
            background:#f3e8ff;
            padding:8px 12px;
            border-radius:12px;
            color:#8d63c7;
            font-weight:600;
            cursor:pointer;
        }

        /* LOGIN BUTTON */
        .login-btn{
            background:#8d63c7;
            color:white;
            padding:8px 14px;
            border-radius:12px;
            text-decoration:none;
            font-weight:600;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#6f49a8;
            transform:translateY(-2px);
        }

        /* HERO */
        .hero{
            margin-top:40px;
            text-align:center;
            position:relative;
            z-index:1;
        }

        .hero h1{
    font-size:40px;
    font-family:'Great Vibes', cursive;
    color:#8d63c7;
}

        .hero p{
            color:#777;
            margin-top:10px;
        }

        /* CAROUSEL */
      .carousel{
    margin:20px auto;
    width:90%;
    height:420px;   /* 🔥 MĂRIT */
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    position:relative;
    z-index:1;
}

.carousel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

        .slides{
            display:flex;
            width:300%;
            height:100%;
            animation:slide 12s infinite;
        }

        .slide{
            width:100%;
            flex-shrink:0;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
            font-weight:600;
            color:white;
        }

        .s1{background:linear-gradient(135deg,#f3a6ff,#b69cff);}
        .s2{background:linear-gradient(135deg,#ffb6c1,#ff8dc7);}
        .s3{background:linear-gradient(135deg,#b69cff,#8d63c7);}

        @keyframes slide{
            0%{transform:translateX(0%)}
            33%{transform:translateX(-100%)}
            66%{transform:translateX(-200%)}
            100%{transform:translateX(0%)}
        }

        /* CATEGORIES */
        .categories{
            display:grid;
            grid-template-columns:repeat(4, 1fr);
            gap:20px;
            padding:40px;
            position:relative;
            z-index:1;
        }

        .card{
            background:white;
            border-radius:18px;
            padding:25px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.06);
            transition:0.3s;
            cursor:pointer;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card h3{
            color:#8d63c7;
            margin-bottom:10px;
        }

        .card p{
            color:#777;
            font-size:14px;
        }

        /* CART PANEL */
        .cart-panel{
            position:fixed;
            right:-350px;
            top:0;
            width:350px;
            height:100vh;
            background:white;
            box-shadow:-5px 0 20px rgba(0,0,0,0.1);
            z-index:999;
            padding:20px;
            transition:0.3s;
        }

        .cart-panel.active{
            right:0;
        }

        .cart-panel h2{
            color:#8d63c7;
            margin-bottom:20px;
        }

        .close{
            cursor:pointer;
            float:right;
            font-size:18px;
            color:#777;
        }


        .products{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
    padding:40px;
    position:relative;
    z-index:1;
}

.product-card{
    background:white;
    border-radius:18px;
    padding:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.06);
    transition:0.3s;
}

.product-card:hover{
    transform:translateY(-5px);
}

.product-card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:12px;
}

.product-card h3{
    color:#8d63c7;
    margin-top:10px;
}

.product-card p{
    color:#777;
    font-size:14px;
}

.price{
    font-weight:600;
    color:#333;
    margin-top:8px;
}

        .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 20px;
    border-radius: 16px;
    width: 400px;
    max-height: 80vh;
    overflow-y: auto;
}

.close {
    float: right;
    cursor: pointer;
    font-size: 18px;
}

.detail-row {
    margin: 6px 0;
    font-size: 14px;
    color: #333;
}

.add-cart-btn {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background: #8d63c7;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}
    </style>
</head>
<body>

<div class="circle1"></div>
<div class="circle2"></div>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">Diva Cosmetics</div>

    <div class="menu">
        <a href="/frontend/html/category.html?category=care">Care</a>
        <a href="/frontend/html/category.html?category=accessories">Accessories</a>
        <a href="/frontend/html/category.html?category=foundation">Foundation</a>
        <a href="/frontend/html/category.html?category=concealer">Concealer</a>
        <a href="/frontend/html/category.html?category=mascara">Mascara</a>
        <a href="/frontend/html/category.html?category=lipstick">Lipstick</a>
        <a href="/frontend/html/category.html?category=blush">Blush</a>

        <a class="login-btn" href="/frontend/html/login.html">Login</a>

        <a href="/frontend/html/cart.html" class="cart">🛒 Cart</a>
    </div>
</div>

<!-- HERO -->
<div class="hero">
    <h1>Welcome to Diva Cosmetics</h1>
    <p>Discover beauty, care and elegance in one place</p>
</div>

<!-- CAROUSEL -->
<!-- IMAGE BANNER -->
<div class="carousel">
    <img src="frontend/images/banner.png"
         style="width:100%; height:100%; object-fit:cover;" />
</div>


<div class="products" id="productsContainer"></div>


<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeProductModal()">✖</span>

        <div id="productDetails"></div>

        <button class="add-cart-btn" onclick="addToCart()">Adaugă în coș</button>
    </div>
</div>

<script>

    let selectedProduct = null;

    // ===== FACADE: încarcă lista de produse =====
    async function loadProducts() {
        try {
            const res = await fetch("/products");
            const products = await res.json();
            renderProducts(products);
        } catch (err) {
            console.error("Eroare la încărcarea produselor:", err);
        }
    }

    // ===== FACADE: randează carduri cu data-attributes (fără onclick inline) =====
    function renderProducts(products) {

        const container = document.getElementById("productsContainer");

        container.innerHTML = products.map(p => `

            <div class="product-card"
                 data-id="${p.id}"
                 data-table="${p.sourceTable || ''}">

                <img
                    src="/images/${p.image_path}"
                    alt="${p.name}"
                    onerror="this.src='/images/placeholder.png'"
                >

                <h3>${p.name}</h3>
                <p>${p.brand || ""}</p>
                <div class="price">${Number(p.price).toFixed(2)} MDL</div>

            </div>

        `).join("");

        initCardListeners(); // 🔥 ADĂUGAT (singura modificare importantă)
    }

    // =========================
    // 🔥 CLICK PE PRODUS → SINGLE PRODUCT PAGE (MODAL)
    // =========================
    function initCardListeners() {

        document.querySelectorAll(".product-card").forEach(card => {

            card.addEventListener("click", () => {

                const id = parseInt(card.dataset.id, 10);
                const table = card.dataset.table;

                if (isNaN(id) || id <= 0) return;

                openProductModal(id, table);
            });

        });
    }

    // ===== OBSERVER: deschide modalul — complet independent de Facade =====
    async function openProductModal(id, sourceTable) {

        try {
            const url = sourceTable
                ? `/observer/product?id=${id}&table=${sourceTable}`
                : `/observer/product?id=${id}`;

            const res = await fetch(url);

            if (!res.ok) {
                console.error("Observer error:", res.status, "| URL:", url);
                return;
            }

            const fullProduct = await res.json();

            selectedProduct = fullProduct;

            const container = document.getElementById("productDetails");

            const exclude = new Set(["id", "image_path"]);

            let html = `<h2>${fullProduct.name}</h2>`;

            Object.entries(fullProduct).forEach(([key, value]) => {

                if (exclude.has(key)) return;
                if (value === null || value === undefined || value === "") return;

                html += `
                    <div class="detail-row">
                        <b>${formatKey(key)}:</b> ${value}
                    </div>
                `;
            });

            container.innerHTML = html;

            document.getElementById("productModal").style.display = "flex";

        } catch (err) {
            console.error("Eroare la deschiderea produsului:", err);
        }
    }

    function formatKey(key) {
        return key
            .replaceAll("_", " ")
            .replace(/\b\w/g, c => c.toUpperCase());
    }

    function closeProductModal() {
        document.getElementById("productModal").style.display = "none";
        selectedProduct = null;
    }

   // ===== OBSERVER: adaugă în coș cu tabelul corect =====
async function addToCart() {

    if (!selectedProduct) return;

    const id    = selectedProduct.id;
    const table = selectedProduct.source_table || "";

    try {
        const url = table
            ? `/observer/add-to-cart?id=${id}&table=${table}`
            : `/observer/add-to-cart?id=${id}`;

        const res = await fetch(url);
        const msg = await res.text();
        alert(msg);

    } catch (err) {
        console.error("Eroare la adăugare în coș:", err);
    }
}

    loadProducts();

</script>

</body>
</html>
