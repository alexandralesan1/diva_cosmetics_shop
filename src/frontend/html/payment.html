<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <title>Payment - Diva Cosmetics</title>

  <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins', sans-serif;
    }

    body{
        min-height:100vh;
        background:linear-gradient(135deg,#faf7ff,#ffffff);
    }

    /* NAVBAR */
    .topbar{
        width:100%;
        height:70px;
        background:white;
        box-shadow:0 5px 20px rgba(0,0,0,0.06);
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 30px;
    }

    .logo{
    font-family:'Great Vibes', cursive;
    font-size:30px;
    color:#8d63c7;
}

    .menu{
        display:flex;
        gap:20px;
        align-items:center;
    }

    .menu a{
        text-decoration:none;
        color:#777;
        font-weight:500;
    }

    /* LAYOUT */
    .container{
        display:flex;
        justify-content:center;
        gap:20px;
        padding:40px;
        flex-wrap:wrap;
    }

    /* PAYMENT CARD */
    .card{
        width:450px;
        background:white;
        border-radius:18px;
        padding:25px;
        box-shadow:0 10px 25px rgba(0,0,0,0.06);
    }

    .card h2{
        color:#8d63c7;
        margin-bottom:20px;
    }

    input{
        width:100%;
        padding:12px;
        margin-bottom:12px;
        border:1px solid #eee;
        border-radius:12px;
        outline:none;
    }

    .row{
        display:flex;
        gap:10px;
    }

    .btn{
        width:100%;
        margin-top:10px;
        padding:12px;
        border:none;
        border-radius:14px;
        background:linear-gradient(135deg,#f3a6ff,#b69cff);
        color:white;
        font-weight:600;
        cursor:pointer;
    }

    /* ORDER SUMMARY */
    #orderBox{
        width:350px;
    }

    #productList{
        display:flex;
        flex-direction:column;
        gap:10px;
        color:#777;
        margin-top:10px;
    }

    .product-line{
        display:flex;
        justify-content:space-between;
        border-bottom:1px solid #eee;
        padding-bottom:6px;
    }

    .total-box{
        margin-top:15px;
        font-size:18px;
        font-weight:700;
        color:#8d63c7;
    }

  </style>
</head>

<body>

<!-- NAVBAR -->
<div class="topbar">
  <div class="logo">Diva Cosmetics</div>

  <div class="menu">
    <a href="/frontend/html/admin_main_page.html">Home</a>
    <a href="#">Women Care</a>
    <a href="#">Men Care</a>
    <a href="#">Cosmetics</a>
    <a href="#">Accessories</a>
  </div>
</div>

<!-- MAIN -->
<div class="container">

  <!-- PAYMENT FORM -->
  <div class="card">
    <h2>Payment Details</h2>

    <input type="text" placeholder="Full Name">
    <input type="text" placeholder="Phone Number">
    <input type="email" placeholder="Email">
    <input type="text" placeholder="Address">

    <div class="row">
      <input type="text" placeholder="Card Number">
    </div>

    <div class="row">
      <input type="text" placeholder="MM/YY">
      <input type="text" placeholder="CVC">
    </div>

    <button class="btn" onclick="sendPayment()">Pay Now</button>
  </div>

  <!-- ORDER SUMMARY (DIN CART) -->
  <div class="card" id="orderBox">
    <h2>Order Summary</h2>

    <div id="productList"></div>

    <div class="total-box">
      Total: <span id="totalPrice">0</span> MDL
    </div>
  </div>

</div>

<!-- SCRIPT -->
<script>

  const data = JSON.parse(localStorage.getItem("cartData"));

  if (data) {

      const list = document.getElementById("productList");
      const total = document.getElementById("totalPrice");

      let html = "";

      data.products.forEach(p => {
          html += `
              <div class="product-line">
                  <span>${p.name}</span>
                  <span>${p.price} MDL</span>
              </div>
          `;
      });

      list.innerHTML = html;
      total.innerText = data.total;
  }

  function sendPayment() {

    const data = JSON.parse(localStorage.getItem("cartData"));

    const paymentPayload = {
        fullName: document.querySelectorAll("input")[0].value,
        phone: document.querySelectorAll("input")[1].value,
        email: document.querySelectorAll("input")[2].value,
        address: document.querySelectorAll("input")[3].value,

        products: data ? data.products : [],
        total: data ? data.total : 0
    };

    fetch("/payment", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(paymentPayload)
    })
    .then(res => res.json())
    .then(res => {
        alert("Order saved!");
        localStorage.removeItem("cartData");
    });
}
</script>

</body>
</html>
